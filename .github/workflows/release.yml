name: Release

on:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "26.x"
  ESBUILD_VERSION: "0.28.2"

jobs:
  check:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      prev_tag: ${{ steps.prev.outputs.prev_tag }}
      prerelease: ${{ steps.prev.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout has full history
        shell: bash
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::Shallow clone detected. The checkout step needs fetch-depth: 0 so git describe/log can see tag history."
            exit 1
          fi

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Detect channel, find previous tag, check for new commits
        id: prev
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"

            PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*-*' --exclude "$TAG" HEAD 2>/dev/null || echo "")

            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' --exclude "$TAG" HEAD 2>/dev/null || echo "")
            fi
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"

            PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' --exclude "$TAG" HEAD 2>/dev/null || echo "")
          fi

          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

          if [ -z "$PREV_TAG" ]; then
            echo "✅ First tag in this channel — nothing to compare against."
            exit 0
          fi

          COMMIT_COUNT=$(git rev-list "${PREV_TAG}..HEAD" --count)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "::error::No new commits since ${PREV_TAG}. Aborting release."
            exit 1
          fi

          echo "✅ Found ${COMMIT_COUNT} new commit(s) since ${PREV_TAG}."

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64

          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64

          - target: macos-arm64
            runner: macos-14
            os: macos
            arch: arm64

          - target: win-x64
            runner: windows-latest
            os: win
            arch: x64

          - target: win-arm64
            runner: windows-11-arm
            os: win
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare build directories
        shell: bash
        run: |
          rm -rf build dist
          mkdir -p build dist

      - name: Bundle Raqule
        shell: bash
        run: |
          npx --yes "esbuild@${ESBUILD_VERSION}" \
            bin/cli.js \
            --bundle \
            --platform=node \
            --format=cjs \
            --target=node26 \
            --outfile=build/raqule.cjs

      - name: Create binary name
        id: binary
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BINARY_NAME="Raqule-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"

          if [ "${{ matrix.os }}" = "win" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          echo "name=${BINARY_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building: ${BINARY_NAME}"

      - name: Create SEA configuration
        shell: bash
        env:
          BINARY_NAME: ${{ steps.binary.outputs.name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");

            const config = {
              main: path.resolve("build/raqule.cjs"),
              mainFormat: "commonjs",
              output: path.resolve("dist", process.env.BINARY_NAME),
              useSnapshot: false,
              useCodeCache: false,
              disableExperimentalSEAWarning: true
            };

            fs.writeFileSync(
              "sea-config.json",
              JSON.stringify(config, null, 2)
            );
          '

      - name: Build standalone executable
        run: node --build-sea sea-config.json

      - name: Make Unix binary executable
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY_NAME: ${{ steps.binary.outputs.name }}
        run: |
          chmod +x "dist/${BINARY_NAME}"

      - name: Smoke test executable
        shell: bash
        env:
          BINARY_NAME: ${{ steps.binary.outputs.name }}
        run: |
          echo "Testing ${BINARY_NAME}"
          "./dist/${BINARY_NAME}" --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.binary.outputs.name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -print

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        shell: bash
        run: |
          sha256sum Raqule-* > SHA256SUMS

      - name: Generate release notes
        env:
          VERSION: ${{ github.ref_name }}
          PREV_TAG: ${{ needs.check.outputs.prev_tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          echo "## What's Changed" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)" \
              | sed 's/@/@\xE2\x80\x8B/g' >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "**Full diff**: https://github.com/${REPO}/compare/${PREV_TAG}...${VERSION}" >> RELEASE_NOTES.md
          else
            echo "- Initial release 🎉" >> RELEASE_NOTES.md
          fi

          echo "" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          cat >> RELEASE_NOTES.md <<EOF
          # Raqule ${VERSION}

          Standalone executables for Linux, macOS, and Windows.

          ## Linux

          ### Linux x64

          \`\`\`bash
          chmod +x Raqule-${VERSION}-linux-x64
          ./Raqule-${VERSION}-linux-x64
          \`\`\`

          ### Linux ARM64

          \`\`\`bash
          chmod +x Raqule-${VERSION}-linux-arm64
          ./Raqule-${VERSION}-linux-arm64
          \`\`\`

          ## macOS

          ### Apple Silicon ARM64

          \`\`\`bash
          chmod +x Raqule-${VERSION}-macos-arm64
          ./Raqule-${VERSION}-macos-arm64
          \`\`\`

          ## Windows

          ### Windows x64

          PowerShell:

          \`\`\`powershell
          .\\Raqule-${VERSION}-win-x64.exe
          \`\`\`

          Command Prompt:

          \`\`\`cmd
          Raqule-${VERSION}-win-x64.exe
          \`\`\`

          ### Windows ARM64

          PowerShell:

          \`\`\`powershell
          .\\Raqule-${VERSION}-win-arm64.exe
          \`\`\`

          Command Prompt:

          \`\`\`cmd
          Raqule-${VERSION}-win-arm64.exe
          \`\`\`

          ## Checksums

          SHA-256 checksums are available in:

          \`\`\`text
          SHA256SUMS
          \`\`\`
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: Raqule ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.check.outputs.prerelease }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
